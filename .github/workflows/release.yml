# Gamma ERP release: builds the two images for amd64 and arm64 and publishes them to the GitHub Container Registry,
#   ghcr.io/gamma-wallet/gamma-erp-api and ghcr.io/gamma-wallet/gamma-erp-web,
# then creates the GitHub release.
#
# - A tag v<version> (for example v0.1.0-gamma) publishes <version> plus the moving tags "gamma" and "latest".
# - Run by hand (Actions > Release > Run workflow) it only builds, to check the images; nothing is published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: gamma-wallet

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      # Both images always finish, so one failure never hides the other.
      fail-fast: false
      matrix:
        include:
          - image: gamma-erp-api
            dockerfile: deploy/Dockerfile
            title: Gamma ERP API
            description: "Gamma ERP: the API and its database migrations (open-source ERP and CRM, AGPL-3.0)"
          - image: gamma-erp-web
            dockerfile: deploy/web.Dockerfile
            title: Gamma ERP web
            description: "Gamma ERP: the screens, served by Caddy, which also passes the API's paths (open-source ERP and CRM, AGPL-3.0)"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=gamma
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=Gamma Wallet Ltd
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build${{ github.event_name == 'push' && ' and publish' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: GitHub release
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          cat > notes.md <<EOF
          **Gamma release.** Gamma ERP is usable and still growing: some modules are not finished yet.

          ## Run it

          \`\`\`sh
          git clone https://github.com/Gamma-Wallet/GammaERP.git
          cd GammaERP/deploy
          cp .env.example .env      # set real values
          docker compose up -d
          \`\`\`

          Images (amd64 and arm64):

          - \`ghcr.io/gamma-wallet/gamma-erp-api:${VERSION}\`
          - \`ghcr.io/gamma-wallet/gamma-erp-web:${VERSION}\`

          The first company and its administrator are made on the server with \`create-company\`: see [deploy/README.md](https://github.com/Gamma-Wallet/GammaERP/blob/${TAG}/deploy/README.md).
          EOF
          gh release create "$TAG" --title "Gamma ERP ${VERSION}" --notes-file notes.md --verify-tag --latest
